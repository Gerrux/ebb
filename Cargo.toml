[package]
name = "ebb"
version = "0.1.1"
edition = "2024"
description = "Notes that ebb away and come back: a calm second-screen layer for Windows"
repository = "https://github.com/Gerrux/ebb"
license = "MIT"
publish = false

[features]
default = ["glow"]
# Exactly one renderer per build; the benchmark compares them (see src/renderer.rs).
glow = ["eframe/glow"]
wgpu = ["eframe/wgpu_no_default_features", "dep:wgpu"]
# egui_mcp support (AccessKit tree over EGUI_INSPECTION=1).
inspection = ["eframe/inspection"]

[dependencies]
eframe = { version = "0.36", default-features = false }
egui = "0.36"
raw-window-handle = "0.6"
# Only to turn on the D3D12 backend (eframe re-exports the API); no Vulkan/GL/Metal.
wgpu = { version = "30", default-features = false, features = ["std", "dx12", "wgsl"], optional = true }
rusqlite ={ version = "0.40", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
# Already pulled in by epaint; used for charmap lookups in src/emoji.rs.
skrifa = { version = "0.44", default-features = false, features = ["std"] }
windows-numerics = "0.3"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_Graphics_Direct2D", "Win32_Graphics_Direct2D_Common", "Win32_Graphics_DirectWrite", "Win32_Graphics_Imaging", "Win32_Graphics_Dxgi_Common","Win32_UI_Controls", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Threading", "Win32_System_ProcessStatus", "Win32_UI_HiDpi", "Win32_System_SystemInformation", "Win32_Storage_FileSystem", "Win32_System_Memory", "Win32_Security", "Win32_Security_Authentication_Identity", "Win32_System_Com", "Win32_System_Variant", "Win32_System_Ole", "Win32_System_TaskScheduler", "Win32_System_Diagnostics_ToolHelp", "Win32_System_RemoteDesktop", "Win32_UI_Shell", "Win32_System_LibraryLoader", "Win32_System_Time", "Win32_System_Registry"] }

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
