  Variable, Segoe Fluent Icons and Consolas, like the app. Regenerate: docs/mock/README.md

  ?scene=cards    a card on hover: its actions and the "Later" menu (780x400)
  ?scene=capture  quick capture, Win+Alt+N (720x212)

<style>

  html, body { margin: 0; background: #0b1220; color: var(--text); font: 14.5px/1.34 var(--ui); }

// One line of a card's text; `a` is the card's mark color, `on` its fill (the check's color).
function lineHtml(raw, c, a, on) {
  let cls = '', pre = '', s = raw
  if (/^- \[[xX]\] /.test(s)) { cls = 'done'; pre = `<span class="box" style="background:rgb(${a});color:rgb(${on})">${ic('check')}</span>`; s = s.slice(6) }
  else if (/^- \[ \] /.test(s)) { cls = 'todo'; pre = '<span class="box"></span>'; s = s.slice(6) }
  else if (/^- /.test(s)) { cls = 'bullet'; pre = '<span class="bul"></span>'; s = s.slice(2) }
  let h = esc(s)
  h = h.replace(/https?:\/\/\S+/g, u => `<span class="url">${u}</span>`)
  if (c.kind === 'prompt') {
    h = h.replace(/\{\{[^}]+\}\}/g, v => `<span class="var" style="color:rgb(${a});background:rgba(${a},.16)">${v}</span>`)
  }
  if (c.mono) { cls += ' mono'; if (c.hover) pre += `<span class="copy">${ic('copyLine')}</span>` }
  return `<div class="ln ${cls}">${pre}${h}</div>`
}

// strip, radius, shadow, opacity, font, text size (half points), background.
const presets = [
  { id: 'ebb', name: 'Ebb', hint: { ru: 'Стекло и свечение цвета', en: 'Glass and a glow of color' },
    st: ['glow', 'top', 50, false, 5, 12, 50, 85, 'system', 29, 'theme'] },
  { id: 'sticky', name: 'Sticky Notes', hint: { ru: 'Цветная бумага, шапка при наведении', en: 'Colored paper, a header on hover' },
    st: ['paper', 'hover', 50, false, 8, 8, 35, 100, 'system', 29, 'theme'] },
  { id: 'keep', name: 'Google Keep', hint: { ru: 'Пастель днём, ночные тона в темноте', en: 'Pastels by day, night shades in the dark' },
    st: ['fill', 'hover', 50, false, 5, 8, 0, 100, 'system', 28, 'theme'] },
  { id: 'canvas', name: 'Obsidian Canvas', hint: { ru: 'Рамка и лёгкий тон', en: 'An outline and a light tint' },
    st: ['outline', 'top', 60, false, 5, 8, 0, 95, 'system', 28, 'theme'] },
  { id: 'trello', name: 'Trello', hint: { ru: 'Цветная метка слева', en: 'A color strip on the left' },
    st: ['strip-left', 'top', 80, false, 4, 6, 20, 100, 'system', 28, 'theme'] },
  { id: 'paper', name: { ru: 'Бумажный стикер', en: 'Paper sticker' }, hint: { ru: 'Заливка, тень, от руки', en: 'Fill, shadow, handwriting' },
    st: ['fill', 'hover', 60, false, 5, 2, 70, 100, 'segoe-print', 29, 'theme'] },
  { id: 'minimal', name: { ru: 'Минимализм', en: 'Minimal' }, hint: { ru: 'Только жирная иконка', en: 'Just a bold icon' },
    st: ['none', 'glyph', 50, true, 5, 12, 20, 85, 'system', 29, 'theme'] },
  { id: 'windows', name: 'Windows', hint: { ru: 'Фон как у панели задач', en: 'The taskbar\'s background' },
    st: ['none', 'top', 50, false, 5, 8, 35, 96, 'system', 28, 'taskbar'] },
]
const EBB = presets[0].st

// Paper (light theme) and night (dark theme) surfaces of each tint (src/card.rs: Tint).
const paper = { yellow: [255, 242, 171], orange: [255, 217, 184], pink: [255, 204, 229], purple: [231, 207, 255],
                blue: [205, 233, 255], teal: [197, 236, 236], green: [203, 241, 196], gray: [237, 238, 241] }
const night = { yellow: [64, 59, 40], orange: [68, 52, 40], pink: [66, 44, 56], purple: [54, 48, 74],
                blue: [36, 50, 70], teal: [34, 58, 60], green: [38, 60, 46], gray: [43, 47, 54] }
const lerp = (a, b, t) => a.map((v, i) => Math.round(v + (b[i] - v) * t))
const rgb = a => a.join(',')

// A card. `o.st` is a preset's style (default Ebb), `o.light` the light theme.
function card(c, x, y, w, h, o = {}) {
  const [marker, spot, strength, bold, strip, radius, shadow, opacity, font, text, bg] = o.st || EBB
  const light = !!o.light
  const s = strength / 50
  const hue = c.tint || kindTint[c.kind]
  // theme::adapt darkens the mark colors on the light theme.
  const mark3 = tint[hue].split(',').map(Number).map(v => light ? Math.floor(v * .68) : v)
  const t = rgb(mark3)
  let base = light ? [249, 250, 252] : [30, 33, 40]
  let hoverBase = light ? [255, 255, 255] : [40, 44, 53]
  if (bg === 'taskbar') {
    base = light ? [238, 238, 238] : [32, 32, 32]
    hoverBase = lerp(base, light ? [0, 0, 0] : [255, 255, 255], .05)
  }
  const alpha = v => Math.min(255, opacity * 2.55 + (v ? 12 : 0)) / 255
  const fill = `rgba(${rgb(c.hover ? hoverBase : base)},${alpha(c.hover).toFixed(3)})`
  const k = shadow / 50
  const shadowCss = shadow ? `, 0 ${Math.round(8 * Math.min(k, 1.5))}px ${Math.round(28 * Math.min(k, 1.5))}px rgba(0,0,0,${(Math.min(160, (light ? 28 : 70) * k) / 255).toFixed(3)})` : ''
  const stroke = light ? 'rgba(0,0,0,.086)' : 'rgba(255,255,255,.102)'
  let over = ''
  if (marker === 'glow') {
    const reach = Math.min(240, Math.max(w, h) * .75), a = Math.min(.2 * s, .6)
    over = `<div class="glow" style="width:${reach}px;height:${reach}px;background:radial-gradient(circle ${reach}px at 0 0,
      rgba(${t},${a}) 0%, rgba(${t},${a * .5625}) 25%, rgba(${t},${a * .25}) 50%, rgba(${t},${a * .0625}) 75%, rgba(${t},0) 100%)"></div>`
  } else if (marker === 'strip-left') {
    over = `<div class="glow" style="width:${strip}px;bottom:0;background:rgba(${t},${Math.min(.85 * s, 1)})"></div>`
  } else if (marker === 'outline') {
    over = `<div class="glow" style="right:0;bottom:0;border-radius:${radius}px;background:rgba(${t},${Math.min(.07 * s, .3)});
      box-shadow:inset 0 0 0 2px rgba(${t},${Math.min(.8 * s, 1)})"></div>`
  } else if (marker === 'fill' || marker === 'paper') {
    // theme::surface: toward the paper (or night shade), above 50 toward the mark color.
    const surf = light ? paper[hue] : night[hue]
    const sc = s <= 1 ? lerp(base, surf, s) : lerp(surf, mark3, Math.min((s - 1) * .5, .5))
    over = `<div class="glow" style="right:0;bottom:0;background:rgba(${rgb(sc)},${alpha(false).toFixed(3)})"></div>`
    if (marker === 'paper' && c.hover) {
      const bar = lerp(sc, mark3, light ? .32 : .22)
      over += `<div class="glow" style="right:0;height:30px;background:rgb(${rgb(bar)})"></div>`
    } else if (c.hover) {
      over += `<div class="glow" style="right:0;bottom:0;background:${light ? 'rgba(0,0,0,.027)' : 'rgba(255,255,255,.04)'}"></div>`
    }
  }
  // The kind's mark: dot and name, the glyph alone, or only on hover. A plain note
  // shows it only on hover.
  let mark = ''
  const shown = c.hover || (spot !== 'hover' && (c.kind !== 'note' || c.tint))
  if (shown && spot === 'glyph') {
    mark = `<div class="mark" style="color:rgb(${t});font-size:${bold ? 14 : 12}px">${ic(c.kind, bold ? '-webkit-text-stroke:.6px' : '')}</div>`
  } else if (shown) {
    const label = L(ui.kinds[c.kind]) + (c.due ? ` · ${L(c.due)}` : '')
    mark = `<div class="mark" style="color:rgb(${t})"><span class="dot" style="background:rgb(${t})"></span>${esc(label)}</div>`
  }
  let right = ''
  if (c.hover) {
    const primary = { prompt: 'copy', reference: 'copy', private: 'copy', link: 'open', goal: 'done', reminder: 'done' }[c.kind]
    const btn = (g, on) => `<span class="b${on ? ' on' : ''}">${ic(g)}</span>`
    right = `<div class="pill">${primary ? `<span class="b" style="background:rgba(${t},.16);color:rgb(${t})">${ic(primary)}</span>` : ''}
      ${btn('later', c.menu)}${primary === 'done' ? '' : btn('archive')}${btn('more')}</div>`
  } else if (c.pinned) {
    right = `<span class="pin ic" style="color:rgb(${t})">&#x${G.pin};</span>`
  }
  let body = ''
  if (c.reason) body += `<div class="reason">${esc(L(c.reason))}</div>`
  if (c.title) body += `<div class="h">${esc(L(c.title))}</div>`
  if (c.kind === 'private') body += `<div class="t sub redacted">••••••••••</div>`
  else body += `<div class="t${c.title ? ' sub' : ''}">${L(c.body).split('\n').map(l => lineHtml(l, c, t, rgb(base))).join('')}</div>`
  if (c.domain) body += `<div class="domain">${esc(c.domain)}</div>`
  // Footer: the idea's status always; tags and age only on hover.
  let foot = ''
  if (c.status) {
    const s = rgb(tint[statusTint[c.status]].split(',').map(Number).map(v => light ? Math.floor(v * .68) : v))
    foot += `<span class="chip status" style="--sc:rgba(${s},.6);--sc2:rgb(${s})">${esc(L(ui.status[c.status]))}</span>`
  }
  if (c.hover) {
    foot += c.tags.map(g => `<span class="chip">#${esc(L(g))}<i class="ic x">&#x${G.x};</i></span>`).join('')
    foot += `<span class="plus ic">&#x${G.plus};</span><span class="age">${esc(L(c.age))}</span>`
  }
  const face = font === 'segoe-print' ? `font-family:'Segoe Print',var(--ui);` : ''
  return `<div class="card${light ? ' light' : ''}" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px;
      border-radius:${radius}px;background:${fill};box-shadow:inset 0 0 0 1px ${stroke}${shadowCss};--fs:${text / 2}px">
    ${over}<div class="meta">${mark}${right}</div><div class="body" style="${face}">${body}</div><div class="foot">${foot}</div></div>`
}

// The Ebb logo, from paint_logo (a 140-unit square).
function logo(size) {
  const wave = y => { let d = ''; for (let i = 0; i <= 48; i++) { const x = 22 + i * 2; d += `${i ? 'L' : 'M'}${x} ${(y - 5 * Math.sin(Math.PI * (x - 22) / 24)).toFixed(2)}` } return d }
  return `<svg width="${size}" height="${size}" viewBox="0 0 140 140">
    <rect width="140" height="140" rx="32" fill="rgb(30,33,40)"/>
    <rect x=".5" y=".5" width="139" height="139" rx="32" fill="none" stroke="rgba(255,255,255,.12)" stroke-width="1.2"/>
    <rect x="42" y="26" width="56" height="44" rx="10" fill="rgb(52,211,153)"/>
    <rect x="54" y="40" width="32" height="5" rx="2.5" fill="rgb(11,59,43)"/>
    <rect x="54" y="51" width="20" height="5" rx="2.5" fill="rgb(11,59,43)"/>
    <path d="${wave(90)}" fill="none" stroke="rgb(45,212,191)" stroke-width="6" stroke-linecap="round"/>
    <path d="${wave(110)}" fill="none" stroke="rgba(45,212,191,.45)" stroke-width="6" stroke-linecap="round"/></svg>`
}

}
